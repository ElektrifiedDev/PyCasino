<div class="game-container">
    <h2>Coin Flip</h2>
    <div id="coin">HEADS</div>
    <div class="controls">
        <button onclick="flip('heads')">Heads</button>
        <button onclick="flip('tails')">Tails</button>
    </div>
    <p id="status"></p>
</div>

<script>
    async function flip(choice) {
        // Direct access to balance-val since we are in the same DOM
        let currentBalance = parseInt(document.getElementById('balance-val').innerText);
        let bet = 10;

        if (currentBalance < bet) return;

        const result = await window.pywebview.api.play_coinflip(bet, choice);
        
        // Update the global balance display directly
        document.getElementById('balance-val').innerText = result.new_balance;
        document.getElementById('status').innerText = result.win ? "WINNER!" : "LOST";
        document.getElementById('coin').innerText = result.outcome.toUpperCase();
    }
</script>
