<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyCasino</title>
    <link rel="stylesheet" href="./assets/styles/styles.css">
</head>
<body>
    <section id="menu-screen" class="app-screen active">
        <h1>PyCasino</h1>
        <div id="save-container">
            <div id="save-list"></div>
            <button id="create-save-btn">New Game</button>
        </div>
    </section>

    <section id="hub-screen" class="app-screen">
        <nav>
            <div class="stats">Balance: $<span id="balance-val">0</span></div>
            <button id="logout-btn">Logout</button>
        </nav>
        <div class="game-grid">
            <button class="game-card" onclick="loadGame('coinflip')">Coin Flip</button>
            <button class="game-card" onclick="loadGame('dice')">Dice Roll</button>
        </div>
    </section>

    <section id="game-viewport" class="app-screen">
        <button id="close-game-btn">← Back to Lobby</button>
        <div id="game-content">
            </div>
    </section>

    <script src="./assets/scripts/app.js"></script>
</body>
</html>
